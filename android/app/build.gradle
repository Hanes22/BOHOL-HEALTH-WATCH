plugins {
    id "com.android.application"
}

android {
    namespace "com.hanesss.boholhealthwatch"
    compileSdk 35

    defaultConfig {
        applicationId "com.hanesss.boholhealthwatch"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "API_BASE", "\"${project.findProperty("BHW_API_BASE") ?: ""}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.work:work-runtime:2.9.1"
}

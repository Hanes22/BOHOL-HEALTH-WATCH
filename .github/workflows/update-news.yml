name: Update news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, curl, simplexml, mbstring
          coverage: none

      - name: Collect news
        env:
          BHW_CONFIG: backend/config.github.php
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          TZ: Asia/Manila
        run: php backend/bin/publish-static.php

      - name: Publish if anything changed
        run: |
          if [ -z "$(git status --porcelain live/feed.json)" ]; then
            echo "No new reports."
            exit 0
          fi
          git config user.name "bohol-health-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/feed.json live/state.sqlite
          git commit -m "Update news feed"
          git pull --rebase origin main
          git push

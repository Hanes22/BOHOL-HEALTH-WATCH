*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

a{color:var(--link)}

button{cursor:pointer}

.masthead{background:var(--blue);color:var(--blue-ink);padding-block:14px 18px}

.latest .search{margin-top:10px}
.latest .list{margin-top:6px}

.freshness{justify-content:flex-start;align-items:center;flex-wrap:wrap}
.refresh{appearance:none;flex:none;min-height:36px;padding:0 10px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--link);font-weight:700;font-size:14px}

.search{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-top:12px}

.opt[aria-checked="true"]{font-weight:700;color:var(--link)}
@media (prefers-reduced-motion:no-preference){.row,.chip{transition:background-color .12s}}
</style>

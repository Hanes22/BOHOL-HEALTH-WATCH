plugins {
    id "com.android.application"
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace "com.hanesss.boholhealthwatch"
    compileSdk 35

    defaultConfig {
        applicationId "com.hanesss.boholhealthwatch"
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.$buildNumber"
        buildConfigField "String", "FEED_URL", "\"${project.findProperty("BHW_FEED_URL") ?: ""}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A fixed test key, so each new APK installs over the old one and keeps settings.
    // It is public in this repo. Use a private key stored in GitHub Secrets for a public release.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.work:work-runtime:2.9.1"
}

name: Build APK

on:
  push:
    paths-ignore:
      - "live/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Put the latest screens and data into the app
        run: python3 build.py

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BoholHealthWatch-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish the permanent download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BoholHealthWatch.apk
          gh release create "build-${{ github.run_number }}" BoholHealthWatch.apk \
            --title "Bohol Health Watch build ${{ github.run_number }}" \
            --notes "Debug build for testing." --latest
